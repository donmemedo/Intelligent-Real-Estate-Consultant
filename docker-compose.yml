# Local development stack. Do not use these default credentials in production.
# Start with: docker compose up -d --build
name: irec-local

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: irec
      POSTGRES_USER: irec_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localownerpasswordchange}
      IREC_DB_APP_PASSWORD: ${IREC_DB_APP_PASSWORD:-localapppasswordchange}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - irec_local_pgdata:/var/lib/postgresql
      - ./deploy/db-init-local.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate:
    image: irec-backend:local
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATIONS_DATABASE_URL: "postgresql+psycopg://irec_owner:${POSTGRES_PASSWORD:-localownerpasswordchange}@db:5432/irec"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: irec-backend:local
    build:
      context: ./backend
    environment:
      IREC_ENV: ${IREC_ENV:-development}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3100}
      DATABASE_URL: "postgresql+psycopg://irec_app:${IREC_DB_APP_PASSWORD:-localapppasswordchange}@db:5432/irec"
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=4).status != 200)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    image: irec-backend:local
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      IREC_ENV: ${IREC_ENV:-development}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3100}
      DATABASE_URL: "postgresql+psycopg://irec_app:${IREC_DB_APP_PASSWORD:-localapppasswordchange}@db:5432/irec"
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: unless-stopped

  frontend:
    image: irec-frontend:local
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3100}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  irec_local_pgdata:
