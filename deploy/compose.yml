# IREC production stack: docker compose -f deploy/compose.yml --env-file deploy/.env up -d
# First run: create deploy/secrets/* (see backend/README.md), then
#   docker compose -f deploy/compose.yml run --rm migrate
name: irec

# Use the default BuildKit network so the build does not require the network.host entitlement.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  pids_limit: 200
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

x-backend-env: &backend-env
  IREC_ENV: production
  PUBLIC_ORIGIN: "https://${IREC_DOMAIN:?set IREC_DOMAIN in deploy/.env}"
  DATABASE_URL_FILE: /run/secrets/database_url

services:
  caddy:
    <<: *hardened
    image: caddy:2.11.7-alpine
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443"]
    environment: { IREC_DOMAIN: "${IREC_DOMAIN}" }
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    networks: [public, app]
    depends_on: [frontend, api]
    mem_limit: 128m

  frontend:
    <<: *hardened
    build: { context: ../frontend }
    image: irec-frontend
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m", "/app/.next/cache:rw,noexec,nosuid,size=64m"]
    networks: [app]
    mem_limit: 384m
    cpus: 1

  api:
    <<: *hardened
    build: { context: ../backend }
    image: irec-backend
    environment:
      <<: *backend-env
      WHATSAPP_APP_SECRET_FILE: /run/secrets/whatsapp_app_secret
      WHATSAPP_VERIFY_TOKEN_FILE: /run/secrets/whatsapp_verify_token
      FORWARDED_ALLOW_IPS: 172.28.10.0/24 # only Caddy's network may set the client IP (login throttle)
    secrets: [database_url, whatsapp_app_secret, whatsapp_verify_token]
    networks: [app, data] # no internet egress: the API only writes rows
    depends_on: { db: { condition: service_healthy } }
    mem_limit: 512m
    cpus: 1

  worker:
    <<: *hardened
    build: { context: ../backend }
    image: irec-backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
      WHATSAPP_TOKEN_FILE: /run/secrets/whatsapp_token
    secrets: [database_url, whatsapp_token] # the only holder of the sending token
    networks: [data, egress]
    healthcheck: { disable: true } # no HTTP port; restart policy covers crashes
    depends_on: { db: { condition: service_healthy } }
    mem_limit: 256m
    cpus: 0.5

  migrate:
    <<: *hardened
    image: irec-backend
    profiles: [tools]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: { MIGRATIONS_DATABASE_URL_FILE: /run/secrets/migrations_database_url }
    secrets: [migrations_database_url]
    networks: [data]

  db:
    <<: *hardened
    image: postgres:18.6-alpine
    # The official entrypoint needs these to initialise and drop to the postgres user.
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    environment:
      POSTGRES_DB: irec
      POSTGRES_USER: irec_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password, db_app_password]
    volumes: ["pgdata:/var/lib/postgresql", "./db-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m", "/var/run/postgresql:rw,noexec,nosuid,size=8m"]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irec_owner -d irec"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1g

networks:
  public: {}
  egress: {}
  app: { internal: true, ipam: { config: [{ subnet: 172.28.10.0/24 }] } }
  data: { internal: true }

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}

secrets:
  database_url: { file: ./secrets/database_url }
  migrations_database_url: { file: ./secrets/migrations_database_url }
  db_owner_password: { file: ./secrets/db_owner_password }
  db_app_password: { file: ./secrets/db_app_password }
  whatsapp_app_secret: { file: ./secrets/whatsapp_app_secret }
  whatsapp_verify_token: { file: ./secrets/whatsapp_verify_token }
  whatsapp_token: { file: ./secrets/whatsapp_token }
