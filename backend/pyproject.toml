[project]
name = "irec-backend"
version = "0.1.0"
description = "IREC API and worker: leads, WhatsApp, handoff and a gated outbox."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "fastapi>=0.142",
    "httpx>=0.28",
    "phonenumbers>=9.0",
    "psycopg[binary]>=3.3",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = ["mypy>=2.4", "pytest>=9.1", "ruff>=0.16"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "S", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
