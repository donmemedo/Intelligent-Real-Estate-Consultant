# Backend and frontend gate (contract SEC-18, SEC-19). Make every job a required check on the protected main branch.
# Pin each action to a commit SHA before relying on this in production (supply-chain hardening).
name: backend

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: irec_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/irec_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.6'
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --python 3.13.6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --strict -r /tmp/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: node scripts/check-safe-next.mjs
      - run: pnpm run typecheck
      - run: pnpm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact
      - name: SAST
        run: >-
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep semgrep scan --metrics=off --error
          --config .semgrep/closivo.yml --config p/python --config p/typescript --config p/react --config p/nextjs
          --config p/owasp-top-ten --config p/secrets backend/app frontend/app frontend/components frontend/lib
      - name: Dockerfile lint
        run: |
          docker run --rm -i hadolint/hadolint:v2.15.1 < backend/Dockerfile
          docker run --rm -i hadolint/hadolint:v2.15.1 < frontend/Dockerfile

  image:
    runs-on: ubuntu-latest
    needs: [test, frontend, security]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t irec-backend:${{ github.sha }} backend
      - name: Image scan and SBOM
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 irec-backend:${{ github.sha }}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" aquasec/trivy:0.75.0 image \
            --format cyclonedx --output /out/sbom-backend.cdx.json irec-backend:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: sbom-backend.cdx.json
